<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windmill — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">

  <!-- Left: form panel -->
  <section class="panel">

    <header class="brand">Windmill</header>

    <main class="form-area">
      <h1>Welcome back!</h1>
      <p class="subtitle">Enter your credentials to access your account</p>

      <div class="oauth-row">
        <button type="button" class="oauth-btn">
          <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Sign in with Google</span>
        </button>

        <button type="button" class="oauth-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#000000" d="M17.05 20.28c-.98.95-2.05.86-3.08.38-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.38C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
          <span>Sign in with Apple</span>
        </button>
      </div>

      <div class="divider"><span>or</span></div>

      <form>
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com">

        <div class="label-row">
          <label for="password">Password</label>
          <a href="#" class="forgot">Forgot your password?</a>
        </div>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="••••••••">
          <svg class="eye" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="#b9b9b9" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="3" stroke="#b9b9b9" stroke-width="1.5"/>
          </svg>
        </div>

        <button type="submit" class="submit-btn">Sign in to your account</button>
      </form>

      <p class="signup-line">Don't have an account? <a href="../sign-up/index.html">Sign up</a></p>
    </main>

    <footer class="panel-footer">
      <a href="#">Help</a>
      <a href="#">Terms</a>
      <a href="#">Privacy</a>
    </footer>

  </section>

  <!-- Right: artwork panel -->
  <section class="art" aria-label="Courtyard architecture photograph"></section>

</div>

</body>
</html>
